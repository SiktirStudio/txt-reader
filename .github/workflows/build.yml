name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-14 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libssl3t64 ca-certificates

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-test, stress, TLS and version (all platforms)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Screenshots (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/bin/novapad --screenshot shots

      - name: Upload screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error

      - name: Package and smoke-test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="$GITHUB_REF_NAME"; else VER="dev"; fi
          bash .github/scripts/package-linux.sh "$VER"

      - name: Package and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build/bin -Recurse -Filter novapad.exe | Select-Object -First 1
          if (-not $exe) { throw 'novapad.exe not found' }
          windeployqt --release --no-translations --compiler-runtime --dir package $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          Copy-Item $exe.FullName package/
          Copy-Item LICENSE,THIRD_PARTY.md package/
          Copy-Item resources/licenses package/licenses -Recurse
          Copy-Item resources/fonts/LICENSE-*.txt package/licenses/
          if (-not (Test-Path 'package/tls/*.dll')) { throw 'TLS backend not deployed' }
          $env:QT_PLUGIN_PATH = "$PWD/package"
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          foreach ($test in @('--tls-check', '--selftest', '--stress')) {
            & "$PWD/package/novapad.exe" $test
            if ($LASTEXITCODE -ne 0) { throw "Packaged app failed $test" }
          }
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path package -DestinationPath "NovaPad-$ver-Windows-x64.zip"

      - name: Package and smoke-test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="$GITHUB_REF_NAME"; else VER="dev"; fi
          mkdir -p build/bin/novapad.app/Contents/Resources/licenses
          cp LICENSE THIRD_PARTY.md build/bin/novapad.app/Contents/Resources/
          cp resources/licenses/* resources/fonts/LICENSE-*.txt build/bin/novapad.app/Contents/Resources/licenses/
          macdeployqt build/bin/novapad.app -dmg
          test -d build/bin/novapad.app/Contents/PlugIns/tls
          for TEST in --tls-check --selftest --stress; do
            env -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH QT_QPA_PLATFORM=offscreen \
              ./build/bin/novapad.app/Contents/MacOS/novapad "$TEST"
          done
          mv build/bin/novapad.dmg "NovaPad-$VER-macOS-arm64.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPad-${{ matrix.name }}
          path: |
            NovaPad-*.zip
            NovaPad-*.tar.gz
            NovaPad-*.dmg
          if-no-files-found: error

  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NovaPad-*
          merge-multiple: true
          path: release-assets
      - name: Attach all three packages and release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES_${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release-assets/NovaPad-${{ github.ref_name }}-Windows-x64.zip
            release-assets/NovaPad-${{ github.ref_name }}-Linux-x64.tar.gz
            release-assets/NovaPad-${{ github.ref_name }}-macOS-arm64.dmg
